name: Build DA HelpHub GHCR Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/you209/da-helphub
  ADDON_REPO: you209/HA-OS-all
  ADDON_PATH: da_helphub/config.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HA_OS_ALL_TOKEN: ${{ secrets.HA_OS_ALL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve next add-on version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HA_OS_ALL_TOKEN}" ]; then
            rm -rf /tmp/ha-os-all
            git clone --depth 1 "https://x-access-token:${HA_OS_ALL_TOKEN}@github.com/${ADDON_REPO}.git" /tmp/ha-os-all
            VERSION=$(python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('/tmp/ha-os-all') / os.environ['ADDON_PATH']
          text = p.read_text()
          m = re.search(r'version:\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not m:
              raise SystemExit('Could not find version in ' + str(p))
          major, minor, patch = map(int, m.groups())
          print(f'{major}.{minor}.{patch + 1}')
          PY
            )
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            echo "HA_OS_ALL_TOKEN secret not set; falling back to ${VERSION} and skipping HA-OS-all update later."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using image version ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update HA-OS-all add-on version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HA_OS_ALL_TOKEN}" ]; then
            echo "HA_OS_ALL_TOKEN secret not set; cannot update HA-OS-all automatically."
            exit 0
          fi
          cd /tmp/ha-os-all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ['VERSION']
          p = Path(os.environ['ADDON_PATH'])
          text = p.read_text()
          text = re.sub(r'version:\s*"[^"]+"', f'version: "{version}"', text, count=1)
          p.write_text(text)
          PY
          git add "${ADDON_PATH}"
          git commit -m "Bump DA HelpHub add-on to ${VERSION}" || exit 0
          git push
        env:
          VERSION: ${{ steps.version.outputs.version }}
